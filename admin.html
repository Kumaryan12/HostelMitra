<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HostelMitra | Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    /* ---------------------- VARIABLES ---------------------- */
    :root {
      --primary: #3B82F6;
      --primary-hover: #60A5FA;
      --secondary: #10B981;
      
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      
      /* Glassmorphism */
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-blur: blur(20px);
      --radius: 16px;
      
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
      --bg-image: url('https://hostelmitra-81b7d.web.app/assets/nit-goa-logo.jpg');
    }

    /* ---------------------- BASE --------------------------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-main);
      color: var(--text-main);
      min-height: 100vh;
      background: 
        linear-gradient(to bottom, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95)),
        var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    a { text-decoration: none; color: inherit; }
    .container { width: min(1300px, 95%); margin-inline: auto; }

    /* ---------------------- HEADER ------------------------- */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 0;
    }
    .nav { display: flex; align-items: center; justify-content: space-between; }
    
    .brand {
      display: flex; align-items: center; gap: 0.75rem;
      font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;
    }
    .brand img {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .nav-actions { display: flex; gap: 0.75rem; align-items: center; }

    /* Buttons */
    .btn {
      padding: 0.6rem 1rem; border-radius: 10px; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
      border: 1px solid transparent; display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn.primary {
      background: var(--secondary); color: white; /* Admin Green */
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }
    .btn.primary:hover { background: #34D399; transform: translateY(-2px); }

    .btn.ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--glass-border);
    }
    .btn.ghost:hover {
      background: var(--glass-bg); color: white; border-color: white;
    }

    /* ---------------------- HERO --------------------------- */
    .hero {
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--glass-border);
    }
    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      font-weight: 800; margin-bottom: 0.5rem;
      background: linear-gradient(to right, #fff, #a7f3d0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p { color: var(--text-muted); max-width: 800px; }

    /* ---------------------- FILTERS ------------------------ */
    main { padding: 2rem 0 4rem; }

    .toolbar {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      display: flex; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap;
    }

    .field { display: flex; flex-direction: column; gap: 0.5rem; }
    
    .field label {
      font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    select {
      padding: 0.6rem 2.5rem 0.6rem 1rem; /* Extra right pad for arrow */
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background-color: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.7rem center;
      background-size: 1em;
    }
    select:focus { outline: none; border-color: var(--secondary); }
    select option { background: #1e293b; color: white; }

    .hint { margin-left: auto; color: var(--text-muted); font-size: 0.85rem; align-self: center; }

    /* ---------------------- TABLE CARD --------------------- */
    .table-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      overflow: hidden; /* For rounded corners */
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .table-head {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02);
    }
    .table-head h2 { font-size: 1.1rem; font-weight: 700; color: #fff; margin: 0; }

    .scroll { width: 100%; overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    
    thead th {
      text-align: left;
      padding: 1rem 1.5rem;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--glass-border);
      font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap;
    }

    tbody td {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--glass-border);
      font-size: 0.95rem;
      vertical-align: top;
      color: #e2e8f0;
    }

    tbody tr:hover { background: rgba(255, 255, 255, 0.03); }

    /* Status Badges (Dynamic classes from JS) */
    .badge {
      display: inline-flex; align-items: center; padding: 0.25rem 0.6rem;
      border-radius: 99px; font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-pending { background: rgba(251, 191, 36, 0.2); color: #FCD34D; border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-progress { background: rgba(59, 130, 246, 0.2); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-resolved { background: rgba(16, 185, 129, 0.2); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.3); }

    /* Visibility Chips */
    .chip {
      display: inline-block; margin-left: 6px; padding: 0.1rem 0.4rem;
      border-radius: 4px; font-size: 0.7rem; font-weight: 600;
      border: 1px solid var(--glass-border);
    }
    .chip-public { background: rgba(59, 130, 246, 0.1); color: #93C5FD; }
    .chip-private { background: rgba(139, 92, 246, 0.1); color: #C4B5FD; }

    /* Base style for the vote circle in the table */
/* Replace your existing .vote class with this */
.vote {
    /* 1. Make it a Circle */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    
    /* 2. Dark Glass Background (Fixes the contrast) */
    background: rgba(0, 0, 0, 0.4); 
    border: 1px solid rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(4px); /* Optional: extra fancy blur */
    
    /* 3. Text Styling */
    color: #FFFFFF;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* Optional: Keep the green glow for high votes */
.vote-high {
    background: rgba(16, 185, 129, 0.25);
    border-color: #34D399;
    color: #34D399;
    text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
}

    /* Action Buttons in Table */
    table button {
      background: transparent; border: 1px solid var(--glass-border);
      color: var(--text-muted); padding: 0.4rem 0.8rem; border-radius: 6px;
      font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    table button:hover {
      background: var(--glass-bg); color: #fff; border-color: #fff;
    }
    
    /* Specific Action Colors */
    table button.btn-success { border-color: rgba(16, 185, 129, 0.5); color: #34D399; }
    table button.btn-success:hover { background: rgba(16, 185, 129, 0.2); }

    /* ---------------------- FOOTER ------------------------- */
    footer {
      border-top: 1px solid var(--glass-border);
      padding: 2rem 0; text-align: center;
      color: var(--text-muted); font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      .toolbar { flex-direction: column; align-items: stretch; gap: 1rem; }
      .hint { margin-left: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="brand">
        <img src="assets/nit-goa-logo.png" alt="Logo" onerror="this.style.display='none'">
        <span>HostelMitra Admin</span>
      </div>
      <div class="nav-actions">
        <button class="btn ghost" onclick="location.href='index.html'">
          <span>Home</span>
        </button>
        <button class="btn primary" onclick="logout()">
          <span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Complaints Dashboard</h1>
      <p>Manage tickets, update statuses, and monitor hostel maintenance in real-time.</p>
    </div>
  </section>

  <main class="container">
    
    <div class="toolbar">
      
      <div class="field">
        <label for="filterVisibility">Visibility</label>
        <select id="filterVisibility">
          <option value="all">All</option>
          <option value="public">Public</option>
          <option value="private">Private</option>
        </select>
      </div>

      <div class="field">
        <label for="filterStatus">Status</label>
        <select id="filterStatus">
          <option value="all">All</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>

      <div class="field">
        <label for="filterSort">Sort By</label>
        <select id="filterSort">
          <option value="new" selected>Newest First</option>
          <option value="old">Oldest First</option>
          <option value="vdesc">Votes (High → Low)</option>
          <option value="vasc">Votes (Low → High)</option>
        </select>
      </div>

      
    </div>

    <section class="table-card">
      <div class="table-head">
        <h2>Active Complaints</h2>
      </div>
      <div class="scroll">
        <table id="complaintsTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Room</th>
              <th>Category</th>
              <th>Description</th>
              <th>Votes</th>
              <th>Status</th>
              <th>Note</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="complaintsBody"></tbody>
        </table>
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      © 2025 NIT Goa • HostelMitra Admin
    </div>
  </footer>

  <script type="module" src="main.js"></script>

</body>
</html>
