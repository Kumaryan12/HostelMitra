<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HostelMitra | Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    /* ---------------------- VARIABLES ---------------------- */
    :root {
      --primary: #3B82F6;
      --primary-hover: #60A5FA;
      --secondary: #10B981;
      
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      
      /* Glassmorphism */
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-blur: blur(20px);
      --radius: 16px;
      
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
      --bg-image: url('https://hostelmitra-81b7d.web.app/assets/nit-goa-logo.jpg');
    }

    /* ---------------------- BASE --------------------------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-main);
      color: var(--text-main);
      min-height: 100vh;
      background: 
        linear-gradient(to bottom, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95)),
        var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    a { text-decoration: none; color: inherit; }
    .container { width: min(1000px, 92%); margin-inline: auto; }

    /* ---------------------- HEADER ------------------------- */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 0;
    }
    .nav { display: flex; align-items: center; justify-content: space-between; }
    
    .brand {
      display: flex; align-items: center; gap: 0.75rem;
      font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;
    }
    .brand img {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .nav-actions { display: flex; gap: 0.75rem; align-items: center; }

    /* Buttons */
    .btn {
      padding: 0.6rem 1rem; border-radius: 10px; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
      border: 1px solid transparent; display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn.primary {
      background: var(--primary); color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    .btn.primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

    .btn.ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--glass-border);
    }
    .btn.ghost:hover {
      background: var(--glass-bg); color: white; border-color: white;
    }

    /* ---------------------- HERO --------------------------- */
    .hero {
      padding: 3rem 0 2rem;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800; margin-bottom: 0.5rem;
      background: linear-gradient(to right, #fff, #a7f3d0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p { color: var(--text-muted); max-width: 600px; margin: 0 auto; }

    /* ---------------------- GRID --------------------------- */
    main { padding-bottom: 4rem; }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
      align-items: center;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    /* Glass Panels */
    .card, .panel {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 2.5rem;
    }

    h2, h3 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 700; }
    .hint { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

    /* ---------------------- FORM STYLES -------------------- */
    .row { margin-bottom: 1.5rem; }
    
    label {
      display: block; font-size: 0.9rem; font-weight: 600;
      color: #fff; margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.2); /* Dark input background */
      color: #fff;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none; border-color: var(--secondary); /* Green focus for admin */
      background: rgba(0, 0, 0, 0.3);
    }
    
    /* Password Toggle */
    .pw-wrap { position: relative; }
    .toggle {
      position: absolute; right: 10px; top: 38px;
      background: rgba(255,255,255,0.1);
      border: none; color: var(--text-muted);
      font-size: 0.8rem; padding: 0.3rem 0.6rem;
      border-radius: 6px; cursor: pointer;
    }
    .toggle:hover { color: #fff; background: rgba(255,255,255,0.2); }

    .actions { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn.wide { flex: 1; justify-content: center; }

    /* ---------------------- SIDE PANEL --------------------- */
    .panel { text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .panel p { color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; }
    
    .hostel-photo {
      width: 100%; height: auto; max-height: 250px;
      object-fit: cover; border-radius: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* ---------------------- FOOTER ------------------------- */
    footer {
      border-top: 1px solid var(--glass-border);
      padding: 2rem 0; text-align: center;
      color: var(--text-muted); font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      .hero h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="brand">
        <img src="assets/nit-goa-logo.png" alt="Logo" onerror="this.style.display='none'">
        <span>HostelMitra</span>
      </div>
      <div class="nav-actions">
        <button class="btn ghost" onclick="location.href='index.html'">
          <span>Home</span>
        </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Admin Portal</h1>
      <p>Secure access for wardens and hostel administration.</p>
    </div>
  </section>

  <main class="container">
    <div class="grid">
      
      <section class="card">
        <h2>Welcome Back</h2>
        <div class="hint">Please enter your credentials to continue.</div>

        <form onsubmit="loginAdmin(); return false;">
          <div class="row">
            <label for="email">Admin Email</label>
            <input id="email" type="email" placeholder="warden@nitgoa.ac.in" autocomplete="username" />
          </div>

          <div class="row pw-wrap">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle" onclick="const p=document.getElementById('password'); p.type = p.type==='password'?'text':'password'; this.textContent = p.type==='password'?'Show':'Hide';">Show</button>
          </div>

          <div class="actions">
            <button type="submit" class="btn primary wide" style="background: var(--secondary);" onclick="loginAdmin()">Login</button>
          </div>
        </form>
      </section>

      <aside class="panel">
        <h3>Streamlined Management</h3>
        <p>Monitor complaints, update statuses, and maintain transparency with the student body in real-time.</p>
        <img class="hostel-photo" src="assets/hostel.jpg" alt="Hostel" onerror="this.style.display='none'">
      </aside>

    </div>
  </main>

  <footer>
    <div class="container">
      © 2025 NIT Goa • HostelMitra
    </div>
  </footer>

  <script type="module" src="main.js"></script>

</body>
</html>
