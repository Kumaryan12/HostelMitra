<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HostelMitra | Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    /* ---------------------- VARIABLES ---------------------- */
    :root {
      --primary: #3B82F6;
      --secondary: #10B981; /* Admin Green */
      
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      
      /* Glassmorphism */
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-blur: blur(20px);
      --radius: 16px;
      
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
      --bg-image: url('https://hostelmitra-81b7d.web.app/assets/nit-goa-logo.jpg');
    }

    /* ---------------------- BASE --------------------------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-main);
      color: var(--text-main);
      min-height: 100vh;
      background: 
        linear-gradient(to bottom, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95)),
        var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    a { text-decoration: none; color: inherit; }
    .container { width: min(1000px, 92%); margin-inline: auto; }

    /* ---------------------- HEADER ------------------------- */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 0;
    }
    .nav { display: flex; align-items: center; justify-content: space-between; }
    
    .brand {
      display: flex; align-items: center; gap: 0.75rem;
      font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;
    }
    .brand img {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .nav-actions { display: flex; gap: 0.75rem; align-items: center; }

    /* Buttons */
    .btn {
      padding: 0.6rem 1rem; border-radius: 10px; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
      border: 1px solid transparent; display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .btn.ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--glass-border);
    }
    .btn.ghost:hover {
      background: var(--glass-bg); color: white; border-color: white;
    }

    /* ---------------------- HERO --------------------------- */
    .hero {
      padding: 3rem 0 2rem;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800; margin-bottom: 0.5rem;
      background: linear-gradient(to right, #fff, #a7f3d0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p { color: var(--text-muted); max-width: 600px; margin: 0 auto; }

    /* ---------------------- GRID --------------------------- */
    main { padding-bottom: 4rem; }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
      align-items: center;
    }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    /* Glass Panels */
    .card, .panel {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 2.5rem;
    }

    h2, h3 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 700; }
    .hint { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

    /* ---------------------- GOOGLE BUTTON ------------------ */
    .google-btn {
      width: 100%;
      display: flex; justify-content: center; align-items: center; gap: 12px;
      background: #FFFFFF; color: #1e293b;
      border: none; border-radius: 12px;
      padding: 1rem;
      font-weight: 600; font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      margin-top: 1rem;
    }
    .google-btn:hover { background: #F1F5F9; transform: translateY(-2px); }
    .google-btn:active { transform: scale(0.98); }
    .google-icon { width: 22px; height: 22px; }

    .domain-hint {
      margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);
      padding: 0.75rem; background: rgba(255, 255, 255, 0.03);
      border-radius: 8px; border: 1px dashed var(--glass-border); text-align: center;
    }

    /* ---------------------- SIDE PANEL --------------------- */
    .panel { text-align: center; display: flex; flex-direction: column; justify-content: center; }
    .panel p { color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; }
    
    .hostel-photo {
      width: 100%; height: auto; max-height: 250px;
      object-fit: cover; border-radius: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* ---------------------- FOOTER ------------------------- */
    footer {
      border-top: 1px solid var(--glass-border);
      padding: 2rem 0; text-align: center;
      color: var(--text-muted); font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      .hero h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="brand">
        <img src="assets/nit-goa-logo.png" alt="Logo" onerror="this.style.display='none'">
        <span>HostelMitra</span>
      </div>
      <div class="nav-actions">
        <button class="btn ghost" onclick="location.href='index.html'">
          <span>Home</span>
        </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Admin Portal</h1>
      <p>Secure access for wardens and hostel administration.</p>
    </div>
  </section>

  <main class="container">
    <div class="grid">
      
      <section class="card">
        <h2>Welcome Back</h2>
        <div class="hint">Sign in with your authorized admin Google account.</div>

        <button class="google-btn" onclick="loginAdmin()">
          <svg class="google-icon" viewBox="0 0 533.5 544.3" xmlns="http://www.w3.org/2000/svg">
            <path d="M533.5 278.4c0-18.4-1.7-36.1-5-53.3H272v100.9h146.9c-6.3 34-25 62.7-53.2 82v67h85.9c50.3-46.3 81.9-114.5 81.9-196.6z" fill="#4285f4"/>
            <path d="M272 544.3c72.9 0 134.1-24.1 178.8-65.3l-85.9-67c-23.9 16-54.5 25.4-92.9 25.4-71.3 0-131.8-48.2-153.5-112.8h-89.8v70.9c44.6 88.2 136.4 148.8 243.3 148.8z" fill="#34a853"/>
            <path d="M118.5 324.6c-10.1-30-10.1-62.3 0-92.3v-70.9h-89.8C2.1 204.3 0 241.6 0 272.2s2.1 67.9 28.7 111.7l89.8-59.3z" fill="#fbbc04"/>
            <path d="M272 107.7c39.6-.6 77.8 14 106.9 40.7l80.2-80.2C404.7 24.3 343.9 0 272 0 165.1 0 73.3 60.6 28.7 148.8l89.8 70.9C140.2 155.1 200.7 107.7 272 107.7z" fill="#ea4335"/>
          </svg>
          Sign in with Google
        </button>

        
      </section>

      <aside class="panel">
        <h3>Streamlined Management</h3>
        <p>Monitor complaints, update statuses, and maintain transparency with the student body in real-time.</p>
      </aside>

    </div>
  </main>

  <footer>
    <div class="container">
      © 2026 NIT Goa • HostelMitra
    </div>
  </footer>

  <script type="module" src="main.js"></script>

</body>
</html>
