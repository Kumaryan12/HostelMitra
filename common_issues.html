<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HostelMitra | Common Issues</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ------------- THEME ------------- */
    :root{
      --student:#2C7BE5;
      --admin:#22B573;
      --accent:#FACC15;
      --ink:#0f172a;
      --muted:#475569;
      --bg:#F8FAFC;
      --card:#FFFFFF;
      --border:#E2E8F0;
      --radius:14px;
      --shadow:0 12px 30px rgba(0,0,0,.12);
      --shadow-sm:0 8px 18px rgba(0,0,0,.10);
    }

    *{box-sizing:border-box}
    body{
      margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--ink); background:var(--bg);
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .container{width:min(1100px,92%);margin-inline:auto}

    /* ------------- NAVBAR ------------- */
    header{
      position:sticky; top:0; z-index:40;
      backdrop-filter:saturate(180%) blur(10px);
      background:linear-gradient(0deg,rgba(255,255,255,.82),rgba(255,255,255,.95));
      border-bottom:1px solid var(--border);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      padding:.9rem 0;
    }
    .brand{
      display:flex; align-items:center; gap:.65rem;
      font-weight:900; letter-spacing:.35px; color:var(--student);
    }
    .brand img{
      width:36px;height:36px;border-radius:8px;object-fit:contain;
      background:#fff;border:1px solid var(--border);
    }
    .nav-actions{display:flex; gap:.6rem; flex-wrap:wrap}
    .btn{
      border:0; border-radius:10px; padding:.65rem 1rem; font-weight:800; cursor:pointer;
      transition:transform .2s, box-shadow .2s, background .2s; display:inline-flex; align-items:center; gap:.5rem;
    }
    .btn.primary{background:var(--student); color:#fff; box-shadow:var(--shadow-sm)}
    .btn.primary:hover{transform:translateY(-2px)}
    .btn.ghost{background:#fff; border:1px solid var(--border); color:var(--ink)}
    .btn.ghost:hover{background:#F1F5F9}

    /* ------------- HERO ------------- */
    .hero{
      background:linear-gradient(135deg, rgba(44,123,229,.10), rgba(34,181,115,.09));
      border-bottom:1px solid var(--border);
    }
    .hero-wrap{
      padding:30px 0; text-align:center;
    }
    .crumb{
      color:#334155; font-weight:800; background:#fff; border:1px solid var(--border);
      padding:.35rem .7rem; border-radius:999px; display:inline-block;
    }
    .hero h1{
      margin:.6rem 0 .35rem; font-size:clamp(1.7rem,3vw,2.1rem); font-weight:900;
    }
    .hero p{ color:var(--muted); margin:0 auto; max-width:760px }

    /* ------------- CONTENT WRAP ------------- */
    main{ padding:22px 0 42px }

    /* Toolbar (non-breaking visual only; no JS required) */
    .toolbar{
      display:flex; justify-content:space-between; align-items:center; gap:.8rem; flex-wrap:wrap;
      margin-bottom:14px;
    }
    .toolbar .hint{ color:var(--muted) }
    .toolbar .right{ display:flex; gap:.6rem; flex-wrap:wrap }

    /* ------------- LIST → CARD GRID ------------- */
    #publicIssues{
      list-style:none; margin:0; padding:0;
      display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
      gap:12px;
    }
    #publicIssues li{
      background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
      padding:14px; box-shadow:var(--shadow-sm);
      transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    #publicIssues li:hover{
      transform:translateY(-3px); box-shadow:var(--shadow);
      border-color:#D7DFEA;
    }
    #publicIssues li b{
      color:#0f172a; font-size:1.02rem;
    }
    #publicIssues li small{
      display:inline-block; margin-top:.35rem; color:#64748B;
    }

    /* Style any inline vote button injected by JS */
    #publicIssues li button{
      margin-top:.6rem; border:1px solid var(--border); background:#fff; color:#0f172a;
      padding:.45rem .7rem; border-radius:999px; font-weight:800; cursor:pointer;
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    #publicIssues li button:hover{ background:#F8FAFC; transform:translateY(-1px) }

    /* ------------- EMPTY STATE ------------- */
    .empty{
      background:#fff; border:1px dashed var(--border); border-radius:12px;
      padding:16px; text-align:center; color:#64748B;
    }

    /* ------------- FOOTER ------------- */
    footer{
      border-top:1px solid var(--border); background:#F1F5F9; color:#0f172a;
      padding:16px 0; margin-top:10px;
    }
    .foot{ display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap }
    .foot small{ color:#334155 }

    /* Motion-respect */
    @media (prefers-reduced-motion: reduce){
      *{transition:none !important}
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <header>
    <div class="container nav">
      <div class="brand">
        <img src="assets/nit-goa-logo.png" alt="NIT Goa" onerror="this.style.display='none'">
        <span>HostelMitra</span>

      </div>
      <button class="btn ghost" onclick="window.location.href='resolved.html'">Resolved</button>

      <div class="nav-actions">
        <button class="btn ghost" onclick="location.href='index.html'">Home</button>
        <button class="btn primary" onclick="location.href='submit_complaint.html'">Submit Complaint</button>
        <button class="btn ghost" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="container hero-wrap">
      <span class="crumb">Student Dashboard</span>
      <h1>Common Issues</h1>
      <p>Live, public complaints from students. Upvote issues that affect many, so wardens can prioritize faster.</p>
    </div>
  </section>

  <!-- CONTENT -->
  <main class="container">
    <div class="toolbar">
      <div class="hint">Tip: Click 👍 on a card to vote. Items update in real time.</div>
      <div class="right">
        <!-- purely visual; your Firestore listener handles content -->
        <span class="crumb" style="border-style:dashed;">Realtime Feed</span>
      </div>
    </div>

    <!-- Your Firestore onSnapshot fills this list. Keep the same ID. -->
    <ul id="publicIssues">
      <!-- Example empty state (will be replaced by JS):
      <li class="empty">No public complaints yet.</li>
      -->
    </ul>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container foot">
      <small>© 2025 NIT Goa • HostelMitra</small>
      <small>Powered by Firebase (Auth • Firestore)</small>
    </div>
  </footer>

  <!-- Keep your logic untouched -->
  <script type="module" src="main.js"></script>
</body>
</html>
