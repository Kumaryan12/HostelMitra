<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HostelMitra | Student Feed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    /* ---------------------- VARIABLES ---------------------- */
    :root {
      --primary: #3B82F6;
      --primary-hover: #60A5FA;
      --secondary: #10B981;
      
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      
      /* Glassmorphism */
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-blur: blur(20px);
      --radius: 16px;
      
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
      --bg-image: url('https://hostelmitra-81b7d.web.app/assets/nit-goa-logo.jpg');
    }

    /* ---------------------- BASE --------------------------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-main);
      color: var(--text-main);
      min-height: 100vh;
      background: 
        linear-gradient(to bottom, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95)),
        var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    a { text-decoration: none; color: inherit; }
    .container { width: min(1200px, 92%); margin-inline: auto; }

    /* ---------------------- HEADER ------------------------- */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 0;
    }
    .nav { display: flex; align-items: center; justify-content: space-between; }
    
    .brand {
      display: flex; align-items: center; gap: 0.75rem;
      font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;
    }
    .brand img {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--glass-border);
    }

    .nav-actions { display: flex; gap: 0.75rem; align-items: center; }

    /* Buttons */
    .btn {
      padding: 0.6rem 1rem; border-radius: 10px; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
      border: 1px solid transparent; display: inline-flex; align-items: center; gap: 0.5rem;
    }
    
    .btn.primary {
      background: var(--primary); color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    .btn.primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

    .btn.ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--glass-border);
    }
    .btn.ghost:hover {
      background: var(--glass-bg); color: white; border-color: white;
    }

    /* ---------------------- HERO --------------------------- */
    .hero {
      padding: 3rem 0 2rem;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800; margin-bottom: 0.5rem;
      background: linear-gradient(to right, #fff, #bae6fd);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p { color: var(--text-muted); max-width: 600px; margin: 0 auto; }

    /* ---------------------- GRID LAYOUT -------------------- */
    main { padding-bottom: 4rem; }

    /* Styling the dynamic list from main.js */
    #publicIssues {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    /* THE CARD STYLE */
    #publicIssues li {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.5s ease forwards;
    }

    #publicIssues li:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    /* ---------------------- INNER CARD CONTENT ------------- */
    /* Targeting elements likely injected by JS */
    
    #publicIssues li b {
      display: block; font-size: 1.15rem; color: #fff;
      margin-bottom: 0.5rem;
    }
    
    #publicIssues li p {
      color: var(--text-muted); font-size: 0.95rem; line-height: 1.5;
      margin-bottom: 1rem;
    }

    #publicIssues li small {
      display: block; margin-top: 1rem; padding-top: 1rem;
      border-top: 1px solid var(--glass-border);
      color: #64748B; font-size: 0.8rem;
    }

    /* Vote Button Styling */
    #publicIssues li button {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34D399;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 0.5rem;
      transition: background 0.2s;
    }
    #publicIssues li button:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    /* Empty State */
    .empty-msg {
      text-align: center; padding: 3rem; grid-column: 1 / -1;
      border: 1px dashed var(--glass-border); border-radius: var(--radius);
      color: var(--text-muted);
    }
    
    /* Container for the vote area */
    .vote-action-area {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--glass-border);
    }

    .vote-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    /* The circular vote count (Green Circle) */
    .vote-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34D399;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* The new Vote Button */
    .vote-btn {
      background: var(--primary); 
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }

    .vote-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .vote-btn:disabled {
      background: var(--glass-bg);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
      border: 1px solid var(--glass-border);
    }

    .vote-warning {
      display: block;
      font-size: 0.75rem;
      color: #fbbf24; /* Amber color for warning */
      font-style: italic;
      opacity: 0.9;
    }

    /* ---------------------- FOOTER ------------------------- */
    footer {
      border-top: 1px solid var(--glass-border);
      padding: 2rem 0; text-align: center;
      color: var(--text-muted); font-size: 0.85rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- MOBILE HEADER FIX (NUCLEAR OPTION) --- */
    /* This overrides everything to ensure buttons are VISIBLE on phones */
    @media (max-width: 768px) {
      
      /* 1. Force Header to Stack Vertically */
      header .nav {
        flex-direction: column !important;
        align-items: center !important;
        padding-bottom: 1rem !important;
      }

      /* 2. Logo Area */
      header .brand {
        margin-bottom: 0.5rem !important;
        width: 100% !important;
        justify-content: center !important;
      }

      /* 3. Button Container: Force a new row */
      header .nav-actions {
        width: 100% !important;
        display: flex !important;
        flex-direction: row !important; /* Keep buttons side-by-side */
        flex-wrap: wrap !important;     /* Allow wrapping if screen is tiny */
        justify-content: center !important;
        gap: 10px !important;
      }

      /* 4. The Buttons Themselves: Make them BIG and VISIBLE */
      header .nav-actions .btn {
        flex: 1 1 auto !important;   /* Grow to fill space */
        min-width: 110px !important; /* Never shrink smaller than this */
        padding: 12px !important;    /* Big touch target */
        font-size: 14px !important;  /* Readable text size */
        display: flex !important;    /* Ensure flexbox works inside */
        align-items: center !important;
        justify-content: center !important;
        white-space: nowrap !important; /* Don't wrap text like "Submit..." */
      }

      /* 5. Ensure SPAN text is visible (overriding your old rule) */
      header .nav-actions .btn span {
        display: block !important;
      }

      /* 6. Push page content down so header doesn't cover it */
      body {
        padding-top: 150px !important; /* Adjust if header is huge */
      }
    }
    
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="brand">
        <img src="assets/nit-goa-logo.png" alt="Logo" onerror="this.style.display='none'">
        <span>HostelMitra</span>
      </div>
      <button class="btn ghost" onclick="location.href='resolved.html'">
          <span>✓ Resolved</span>
        </button>
      
      <div class="nav-actions">
        <button class="btn primary" onclick="location.href='submit_complaint.html'">
          <span>New Complaint</span>
        </button>

        
        
        <button class="btn ghost" onclick="logout()" title="Logout">
          <span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Community Feed</h1>
      <p>Upvote common issues to help wardens prioritize fixes.</p>
    </div>
  </section>

  <main class="container">
    <ul id="publicIssues">
      <div class="empty-msg">Loading feeds...</div>
    </ul>
  </main>

  <footer>
    <div class="container">
      © 2026 NIT Goa • HostelMitra
    </div>
  </footer>

  <script type="module" src="main.js"></script>

</body>
</html>
